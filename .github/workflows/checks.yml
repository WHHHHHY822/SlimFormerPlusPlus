name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q nnUNetTrainer_SlimFormerPlusPlus.py nnUNetTrainer_SlimFormerPlusPlus_Attention.py tools/install.py tools/check_environment.py tools/smoke_test.py reproduce.py benchmark.py tools/tests
      - name: Test installer and experiment bundles
        run: python -m unittest discover -s tools/tests -v
      - name: Test evaluation on synthetic images
        run: |
          python -m pip install numpy==1.26.4 scipy==1.17.1 SimpleITK==2.5.6
          python -m unittest discover -s tools/tests -p test_reproduction.py -v
