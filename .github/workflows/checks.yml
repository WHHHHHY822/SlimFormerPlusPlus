name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q nnUNetTrainer_SlimFormerPlusPlus.py nnUNetTrainer_SlimFormerPlusPlus_Attention.py install.py check_environment.py smoke_test.py tests
      - name: Test safe installer
        run: python -m unittest discover -s tests -v
